[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""


[project]
name = "pylluminator"
version = "1.3"
authors = [{name = "Elio", email = "elio.fanchon@univ-amu.fr"}]
maintainers = [{name = "Elio", email = "elio.fanchon@univ-amu.fr"}]
requires-python = ">= 3.12"
description = 'Tool to preprocess, analyze and visualize DNA methylation data from Illumina micro-arrays'
readme = 'README.rst'
license = "MIT"
keywords = ["dna-methylation", "epigenetics", "illumina", "bioinformatics", "microarray", "methylation", "DMR"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics"
]
dependencies = [
  'inmoose>=0.9.1',
  'joblib>=1.5.3',
  'KDEpy>=1.1.12',
  'matplotlib>=3.10.8',
  'notebook>=7.5.5',
  'numpy>=2.4.3',
  'pandas>=2.2.0',
  'patsy>=1.0.2',
  'pyranges1>=1.3.3',
  'scikit-learn>=1.8.0',
  'scipy>=1.17.1',
  'statsmodels>=0.14.6',
  'seaborn>=0.13.2'
  ]

[project.optional-dependencies]
dev = ['coverage>=7.13.4', 'pytest>=9.0.2']
docs = ['sphinx>=9.1.0', 'sphinx_rtd_theme', 'nbsphinx']
gsea = ['gseapy>=1.1.12', 'networkx>=3.6.1']

[project.urls]
Homepage = "https://pylluminator.readthedocs.io/"
Documentation = "https://pylluminator.readthedocs.io/"
Repository = "https://github.com/eliopato/pylluminator"
Issues = "https://github.com/eliopato/pylluminator/issues"

[dependency-groups]
dev = []

[tool.pytest.ini_options]
filterwarnings = [
  "ignore::DeprecationWarning:numpy.matrixlib",
  "ignore::PendingDeprecationWarning:numpy.matrixlib",
  "ignore::RuntimeWarning:inmoose.pycombat",
]
